<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match | Logan Loftus</title>
  <meta name="description" content="A card-flipping memory game with three difficulty levels and saved best scores." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../projects.css" />
  <style>
    :root { --accent: var(--magenta); }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), 1fr);
      gap: clamp(8px, 1.6vw, 14px);
      max-width: calc(var(--cols, 4) * 124px);
      margin: 0 auto;
    }

    .card {
      position: relative;
      aspect-ratio: 3 / 4;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      perspective: 800px;
    }
    .card:focus-visible { outline-offset: 4px; border-radius: 12px; }
    .card__inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.45s var(--ease-out);
      animation: deal 0.45s var(--ease-out) backwards;
      animation-delay: calc(var(--i) * 25ms);
    }
    @keyframes deal { from { opacity: 0; scale: 0.6; } }
    .card:hover .card__inner { translate: 0 -3px; }
    .card.is-flipped .card__inner,
    .card.is-matched .card__inner { transform: rotateY(180deg); }

    .card__face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .card__back {
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background:
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.07) 0 6px, transparent 6px 12px),
        linear-gradient(135deg, var(--magenta), var(--blue));
      box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.8);
    }
    .card__back::after {
      content: "LL";
      display: grid;
      place-items: center;
      width: 44%;
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-pixel);
      font-size: clamp(0.5rem, 1.4vw, 0.7rem);
    }
    .card__front {
      border: 2px solid #e2dccb;
      background: #f7f4ec;
      font-size: clamp(1.7rem, 5.5vw, 2.8rem);
      transform: rotateY(180deg);
      box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.8);
    }
    .card.is-matched .card__front {
      border-color: var(--lime);
      box-shadow: 0 0 0 2px var(--lime), 0 0 26px rgba(61, 255, 139, 0.55);
    }
    .card.is-matched { cursor: default; }
    .card.is-matched .card__inner { translate: 0 0; }
    .card.is-wrong { animation: shake 0.4s; }
    @keyframes shake {
      20% { translate: -6px 0; }
      40% { translate: 6px 0; }
      60% { translate: -4px 0; }
      80% { translate: 4px 0; }
    }

    .win {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(5, 6, 13, 0.7);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .win[hidden] { display: none; }
    .win__box {
      width: min(100%, 420px);
      padding: 32px 28px;
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      background: var(--surface);
      text-align: center;
      animation: rise 0.4s var(--ease-out);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(0.96); } }
    .win__stars { font-size: 2.4rem; letter-spacing: 6px; }
    .win__box h2 { margin: 10px 0 6px; font-family: var(--font-head); font-size: 2rem; }
    .win__box p { color: var(--muted); }
    .win__box .btn { margin-top: 22px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html#projects">← Back to portfolio</a>
    <span class="topbar__title">MEMORY MATCH</span>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>Memory Match</h1>
      <p>Flip two cards at a time and find every pair. Fewer moves earns more stars. Your best result for each difficulty is saved in your browser.</p>
    </div>

    <div class="toolbar">
      <div class="segmented" role="group" aria-label="Difficulty">
        <button type="button" data-pairs="6" aria-pressed="false">Easy</button>
        <button type="button" data-pairs="8" aria-pressed="true">Normal</button>
        <button type="button" data-pairs="12" aria-pressed="false">Hard</button>
      </div>
      <span class="toolbar__spacer"></span>
      <button type="button" class="btn" id="restart">↻ New game</button>
    </div>

    <div class="hud">
      <div class="stat"><span class="stat__label">Moves</span><span class="stat__value" id="moves">0</span></div>
      <div class="stat"><span class="stat__label">Time</span><span class="stat__value" id="time">0:00</span></div>
      <div class="stat"><span class="stat__label">Pairs</span><span class="stat__value" id="pairs">0 / 8</span></div>
      <div class="stat"><span class="stat__label">Best</span><span class="stat__value" id="best">—</span></div>
    </div>

    <div class="board" id="board" aria-label="Cards"></div>

    <p class="footnote">Built with CSS 3D transforms and plain JavaScript. <a href="https://github.com/Fr0gan/portfolio/tree/main/projects/memory-match" target="_blank" rel="noopener">View source</a></p>
  </main>

  <div class="win" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win__box">
      <div class="win__stars" id="win-stars" aria-hidden="true">★★★</div>
      <h2 id="win-title">You win!</h2>
      <p id="win-text"></p>
      <button type="button" class="btn btn--primary" id="play-again">Play again</button>
    </div>
  </div>

  <script>
  (() => {
    const SYMBOLS = [
      ['🐸', 'frog'], ['🗡️', 'sword'], ['⛰️', 'mountain'], ['🎮', 'controller'],
      ['👾', 'space invader'], ['🃏', 'joker'], ['🍙', 'rice ball'], ['🏯', 'castle'],
      ['🐉', 'dragon'], ['🔥', 'fire'], ['🌙', 'moon'], ['🌲', 'pine tree'],
    ];
    const COLS = { 6: 4, 8: 4, 12: 6 };
    const store = {
      get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ } },
    };

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timeEl = document.getElementById('time');
    const pairsEl = document.getElementById('pairs');
    const bestEl = document.getElementById('best');
    const win = document.getElementById('win');
    const difficultyButtons = document.querySelectorAll('[data-pairs]');

    let pairs = 8;
    let first = null;
    let locked = false;
    let moves = 0;
    let matched = 0;
    let startTime = 0;
    let timer = 0;

    const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    const bestKey = () => `memory-match-best-${pairs}`;
    const elapsedSeconds = () => (startTime ? Math.floor((Date.now() - startTime) / 1000) : 0);

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function updateHud() {
      movesEl.textContent = moves;
      pairsEl.textContent = `${matched} / ${pairs}`;
      timeEl.textContent = formatTime(elapsedSeconds());
      const best = store.get(bestKey());
      bestEl.textContent = best ? `${best.moves} moves` : '—';
    }

    function newGame() {
      clearInterval(timer);
      first = null;
      locked = false;
      moves = 0;
      matched = 0;
      startTime = 0;
      win.hidden = true;

      const deck = shuffle(shuffle([...SYMBOLS]).slice(0, pairs).flatMap((s) => [s, s]));
      board.style.setProperty('--cols', COLS[pairs]);
      board.innerHTML = '';
      deck.forEach(([emoji, name], i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.dataset.symbol = emoji;
        card.dataset.name = name;
        card.style.setProperty('--i', i);
        card.setAttribute('aria-label', `Card ${i + 1}, face down`);
        card.innerHTML = `<span class="card__inner"><span class="card__face card__back"></span><span class="card__face card__front" aria-hidden="true">${emoji}</span></span>`;
        board.appendChild(card);
      });
      updateHud();
    }

    function reveal(card, faceUp) {
      card.classList.toggle('is-flipped', faceUp);
      const index = [...board.children].indexOf(card) + 1;
      card.setAttribute('aria-label', faceUp ? `Card ${index}, ${card.dataset.name}` : `Card ${index}, face down`);
    }

    function finish() {
      clearInterval(timer);
      const seconds = elapsedSeconds();
      const stars = moves <= pairs * 1.5 ? 3 : moves <= pairs * 2.2 ? 2 : 1;
      const best = store.get(bestKey());
      const isBest = !best || moves < best.moves || (moves === best.moves && seconds < best.seconds);
      if (isBest) store.set(bestKey(), { moves, seconds });

      document.getElementById('win-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      document.getElementById('win-title').textContent = isBest ? 'New best!' : 'You win!';
      document.getElementById('win-text').textContent = `${moves} moves in ${formatTime(seconds)}.`;
      updateHud();
      setTimeout(() => {
        win.hidden = false;
        document.getElementById('play-again').focus();
      }, 500);
    }

    board.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card || locked || card === first || card.classList.contains('is-matched')) return;

      if (!startTime) {
        startTime = Date.now();
        timer = setInterval(updateHud, 1000);
      }
      reveal(card, true);

      if (!first) {
        first = card;
        return;
      }

      moves += 1;
      const second = card;
      if (first.dataset.symbol === second.dataset.symbol) {
        [first, second].forEach((c) => {
          c.classList.add('is-matched');
          c.setAttribute('aria-label', `${c.dataset.name}, matched`);
        });
        first = null;
        matched += 1;
        updateHud();
        if (matched === pairs) finish();
      } else {
        locked = true;
        const pair = [first, second];
        first = null;
        updateHud();
        setTimeout(() => pair.forEach((c) => c.classList.add('is-wrong')), 350);
        setTimeout(() => {
          pair.forEach((c) => {
            c.classList.remove('is-wrong');
            reveal(c, false);
          });
          locked = false;
        }, 900);
      }
    });

    difficultyButtons.forEach((button) => {
      button.addEventListener('click', () => {
        pairs = Number(button.dataset.pairs);
        difficultyButtons.forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
        newGame();
      });
    });
    document.getElementById('restart').addEventListener('click', newGame);
    document.getElementById('play-again').addEventListener('click', newGame);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !win.hidden) win.hidden = true;
    });

    newGame();
  })();
  </script>
</body>
</html>
